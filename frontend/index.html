<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/swift.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Swifty Car Rental — Browse affordable premium vehicles, book instantly, and hit the road in Penang, Malaysia. Fast, fun, and reliable." />
    <meta name="keywords" content="car rental, Penang car rental, rent a car Malaysia, Swifty, affordable car hire, premium fleet" />
    <meta name="author" content="Naufalafels Software Services" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://swifty.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Swifty Car Rental | Book Premium Cars Instantly in Penang" />
    <meta property="og:description" content="Browse affordable premium vehicles, book instantly, and hit the road. Fast, fun, and reliable car rental in Malaysia." />
    <meta property="og:url" content="https://swifty.com/" />
    <meta property="og:image" content="https://swifty.com/og-image.jpg" />
    <meta property="og:site_name" content="Swifty" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swifty Car Rental | Book Premium Cars Instantly" />
    <meta name="twitter:description" content="Browse affordable premium vehicles, book instantly. Fast, fun, and reliable car rental." />
    <meta name="twitter:image" content="https://swifty.com/og-image.jpg" />

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#0F172A" />

    <title>Swifty Car Rental | Book Premium Cars Instantly in Penang</title>

    <!-- Structured Data: LocalBusiness + AutoRental -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoRental",
      "name": "Swifty Car Rental",
      "description": "Premium car rental service in Penang, Malaysia. Browse affordable vehicles and book instantly.",
      "url": "https://swifty.com",
      "telephone": "+61481152728",
      "email": "admin@swifty.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Bayan Baru",
        "addressLocality": "Pulau Pinang",
        "postalCode": "11950",
        "addressCountry": "MY"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "08:00", "closes": "20:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "18:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "10:00", "closes": "16:00" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
